name: Android Widget Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x examples/android-widget/gradlew

      - name: Configure stable signing key (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > examples/android-widget/release.keystore
            echo "MIGOKU_KEYSTORE_PATH=$(pwd)/examples/android-widget/release.keystore" >> $GITHUB_ENV
            echo "MIGOKU_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "MIGOKU_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
            echo "MIGOKU_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; using fallback debug signing."
          fi

      - name: Get git commit hash
        id: git_hash
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd examples/android-widget
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK for direct download
        run: |
          cp examples/android-widget/app/build/outputs/apk/release/app-release.apk \
            examples/android-widget/app/build/outputs/apk/release/migoku-widget-${{ steps.git_hash.outputs.hash }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: examples/android-widget/app/build/outputs/apk/release/migoku-widget-${{ steps.git_hash.outputs.hash }}.apk
          if-no-files-found: error
          archive: false
