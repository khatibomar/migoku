name: Android Widget Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x examples/android-widget/gradlew

      - name: Build Debug APK
        run: |
          cd examples/android-widget
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: migoku-android-widget-apk
          path: examples/android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
