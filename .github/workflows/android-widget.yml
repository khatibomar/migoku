name: Android Widget Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'examples/android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug and Release APKs
    environment: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 'tools' is no longer published in the SDK repository; installing it
          # makes sdkmanager exit 1. Gradle downloads platform/build-tools itself.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x examples/android-widget/gradlew

      - name: Configure stable signing key (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > examples/android-widget/release.keystore
            if keytool -list -keystore examples/android-widget/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
              echo "MIGOKU_KEYSTORE_PATH=$(pwd)/examples/android-widget/release.keystore" >> $GITHUB_ENV
              echo "MIGOKU_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
              echo "MIGOKU_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
              echo "MIGOKU_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
            else
              echo "Stable signing secrets are invalid; release build will be produced without stable signing."
              rm -f examples/android-widget/release.keystore
            fi
          else
            echo "No stable signing secret found; release build will be produced without stable signing."
          fi

      - name: Run unit tests
        run: |
          cd examples/android-widget
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        env:
          MIGOKU_GIT_HASH: ${{ github.sha }}
        run: |
          cd examples/android-widget
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get git commit hash
        id: git_hash
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get build timestamp
        id: build_time
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.build_time.outputs.time }}
          MIGOKU_GIT_HASH: ${{ steps.git_hash.outputs.hash }}
        run: |
          cd examples/android-widget
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find Release APK
        id: find_release_apk
        run: |
          APK=$(find examples/android-widget/app/build/outputs -name '*-release.apk' -o -name '*.apk' 2>/dev/null | grep -E 'release.*\.apk$' | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found"
            find examples/android-widget/app/build/outputs -type f -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found release APK: $APK"

      - name: Prepare APK for direct download
        run: |
          mkdir -p examples/android-widget/app/build/outputs/apk/release/
          cp ${{ steps.find_release_apk.outputs.apk_path }} \
            examples/android-widget/app/build/outputs/apk/release/migoku-widget-${{ steps.git_hash.outputs.hash }}-${{ steps.build_time.outputs.time }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: migoku-widget-debug-${{ steps.git_hash.outputs.hash }}
          path: examples/android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: examples/android-widget/app/build/outputs/apk/release/migoku-widget-${{ steps.git_hash.outputs.hash }}-${{ steps.build_time.outputs.time }}.apk
          if-no-files-found: error
          archive: false
